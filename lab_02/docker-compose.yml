version: '3.8'

networks:
  backend-network:
    driver: bridge

volumes:
  mongodb-data:
    name: rfm-mongodb-data
    driver: local

services:
  # Сервис базы данных MongoDB
  mongodb:
    image: mongo:7.0-jammy
    container_name: rfm-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - backend-network
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-secure_mongo_password}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-rfm_analysis}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Init-контейнер для загрузки данных
  loader:
    build:
      context: ./loader
      dockerfile: Dockerfile
    container_name: rfm-loader
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend-network
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-secure_mongo_password}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-rfm_analysis}
      - DATA_PATH=/data/customers.json
    volumes:
      - ../data:/data:ro
    restart: "no"

  # Основное приложение Streamlit
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: rfm-app
    depends_on:
      mongodb:
        condition: service_healthy
      loader:
        condition: service_completed_successfully
    networks:
      - backend-network
    ports:
      - "8501:8501"
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-secure_mongo_password}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-rfm_analysis}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Опционально: Mongo Express (Web UI для MongoDB)
  mongo-express:
    image: mongo-express:latest
    container_name: rfm-mongo-express
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend-network
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-secure_mongo_password}
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    restart: unless-stopped
    profiles:
      - debug
      - tools
